name: Source, test and lint checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            dashboard/requirements.txt
            tests/requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m pip install coverage
      - name: Run unit tests with coverage
        run: |
          python -m coverage run --source=dashboard -m unittest discover -s tests -v
          python -m coverage report
      - name: Verify repository contents
        run: python scripts/verify_repository.py

      - name: Validate commit subjects
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$zero" ]; then
            range="${BEFORE_SHA}..${HEAD_SHA}"
          else
            range="${HEAD_SHA}^!"
          fi
          python scripts/check_commit_messages.py --range "$range"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install ruff
        run: python -m pip install ruff==0.17.3
      - name: Lint Python sources
        run: ruff check dashboard scripts tests
