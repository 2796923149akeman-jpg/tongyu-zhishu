name: Source and dialogue checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: xiaozhi-server/requirements.txt
      - name: Install test dependencies
        run: python -m pip install httpx==0.28.1 PyYAML==6.0.3
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_repository.py
