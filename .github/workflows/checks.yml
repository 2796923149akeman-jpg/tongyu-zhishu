name: Source, test and lint checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            dashboard/requirements.txt
            tests/requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m pip install coverage
      - name: Run unit tests with coverage
        run: |
          python -m coverage run --source=dashboard -m unittest discover -s tests -v
          python -m coverage report
      - name: Verify repository contents
        run: python scripts/verify_repository.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install ruff
        run: python -m pip install ruff==0.17.3
      - name: Lint Python sources
        run: ruff check dashboard scripts tests
