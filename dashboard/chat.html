<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>陪伴对话记录</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light; --ink: #17202a; --muted: #657180; --line: #dde3e9;
      --panel: #fff; --canvas: #f4f7f9; --brand: #176b67; --brand-soft: #e5f4f1;
      --assistant: #eef2ff; --danger: #b42318;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--canvas); color: var(--ink); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 24px 0 42px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 12px; background: var(--brand); color: #fff; font-size: 20px; }
    h1 { margin: 0; font-size: 24px; letter-spacing: .02em; }
    .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .top-actions { display: flex; gap: 9px; }
    .button { min-height: 38px; padding: 0 15px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); color: var(--ink); white-space: nowrap; }
    .button.primary { border-color: var(--brand); background: var(--brand); color: #fff; }
    .workspace { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 680px; overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); box-shadow: 0 12px 35px rgba(26, 48, 64, .08); }
    .sidebar { padding: 20px; border-right: 1px solid var(--line); background: #fbfcfd; }
    .sidebar h2 { margin: 0 0 13px; font-size: 14px; }
    .field { display: grid; gap: 7px; margin-bottom: 15px; }
    .field label { color: var(--muted); font-size: 12px; }
    .field input, .field select { width: 100%; height: 39px; padding: 0 11px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); outline: none; }
    .field input:focus, .field select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin: 22px 0; }
    .stat { padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .stat strong { display: block; font-size: 21px; }
    .stat span { color: var(--muted); font-size: 11px; }
    .privacy { padding: 12px; border-radius: 10px; background: var(--brand-soft); color: #315d59; font-size: 12px; line-height: 1.7; }
    .main { display: flex; min-width: 0; flex-direction: column; }
    .main-head { display: flex; align-items: center; justify-content: space-between; gap: 15px; min-height: 67px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
    .connection { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #d19a29; box-shadow: 0 0 0 4px #fff4d6; }
    .connection.ok .dot { background: #1d9463; box-shadow: 0 0 0 4px #ddf4e8; }
    .connection.error { color: var(--danger); }
    .connection.error .dot { background: var(--danger); box-shadow: 0 0 0 4px #fee4e2; }
    .message-list { flex: 1; min-height: 0; overflow: auto; padding: 24px clamp(18px, 5vw, 64px); background: linear-gradient(#fff, #fcfdfd); }
    .day { margin: 8px 0 22px; text-align: center; color: var(--muted); font-size: 12px; }
    .message { display: flex; gap: 11px; margin: 0 0 20px; }
    .message.assistant { flex-direction: row-reverse; }
    .avatar { display: grid; flex: 0 0 35px; width: 35px; height: 35px; place-items: center; border-radius: 10px; background: var(--brand-soft); color: var(--brand); font-weight: 700; font-size: 12px; }
    .assistant .avatar { background: var(--assistant); color: #5366aa; }
    .message-body { max-width: min(76%, 660px); }
    .message-head { display: flex; gap: 8px; margin: 0 3px 6px; color: var(--muted); font-size: 11px; }
    .assistant .message-head { justify-content: flex-end; }
    .bubble { padding: 12px 15px; border: 1px solid var(--line); border-radius: 5px 15px 15px 15px; background: #fff; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.72; }
    .assistant .bubble { border-color: #dce2fa; border-radius: 15px 5px 15px 15px; background: var(--assistant); }
    .session { margin: 6px 3px 0; color: #87919d; font-size: 10px; overflow-wrap: anywhere; }
    .assistant .session { text-align: right; }
    .empty { display: grid; min-height: 490px; place-items: center; text-align: center; color: var(--muted); }
    .empty strong { display: block; margin-bottom: 7px; color: var(--ink); font-size: 17px; }
    .main-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 8px 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    dialog { width: min(480px, calc(100% - 32px)); padding: 0; border: 0; border-radius: 15px; box-shadow: 0 20px 70px rgba(15, 30, 40, .25); }
    dialog::backdrop { background: rgba(23, 32, 42, .45); backdrop-filter: blur(2px); }
    .dialog-head { display: flex; justify-content: space-between; padding: 20px 22px 14px; border-bottom: 1px solid var(--line); }
    .dialog-head h2 { margin: 0; font-size: 18px; }
    .close { border: 0; background: transparent; color: var(--muted); font-size: 21px; }
    .settings { padding: 20px 22px; }
    .checks { display: grid; gap: 12px; margin: 18px 0; }
    .checks label { display: flex; align-items: center; gap: 9px; font-size: 13px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 9px; padding-top: 8px; }
    .save-state { min-height: 20px; color: var(--danger); font-size: 12px; }
    @media (max-width: 760px) {
      .shell { width: min(100% - 18px, 680px); padding-top: 12px; }
      .topbar { align-items: flex-start; }
      .workspace { grid-template-columns: 1fr; }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
      .stats, .privacy { display: none; }
      .message-list { padding: 20px 14px; }
      .message-body { max-width: 84%; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">语</div>
        <div><h1 id="pageTitle">陪伴对话记录</h1><p class="subtitle">查看设备语音识别与助手回复</p></div>
      </div>
      <div class="top-actions">
        <button class="button" id="settingsButton" type="button">界面设置</button>
        <a class="button" href="/" style="display:grid;place-items:center;text-decoration:none">返回监控</a>
      </div>
    </header>
    <section class="workspace">
      <aside class="sidebar" aria-label="对话筛选">
        <h2>筛选记录</h2>
        <div class="field"><label for="search">搜索内容</label><input id="search" type="search" placeholder="输入关键词"></div>
        <div class="field"><label for="device">设备</label><select id="device"><option value="">全部设备</option></select></div>
        <div class="field"><label for="role">消息角色</label><select id="role"><option value="">全部角色</option><option value="user">用户</option><option value="assistant">助手</option></select></div>
        <div class="field"><label for="session">会话</label><select id="session"><option value="">全部会话</option></select></div>
        <div class="stats">
          <div class="stat"><strong id="messageCount">0</strong><span>当前记录</span></div>
          <div class="stat"><strong id="deviceCount">0</strong><span>设备数量</span></div>
        </div>
        <div class="privacy">页面仅展示记录，不发送消息，也不会单独请求对话模型。对话页面及数据接口仅允许在服务电脑本机访问。</div>
      </aside>
      <main class="main">
        <div class="main-head">
          <div><strong>消息时间线</strong><div class="subtitle" id="resultSummary">正在读取记录</div></div>
          <div class="connection" id="connection" role="status"><span class="dot"></span><span>正在连接</span></div>
        </div>
        <section class="message-list" id="messageList" aria-live="polite" aria-label="对话消息">
          <div class="empty" id="empty"><div><strong>暂无对话记录</strong><span>设备产生语音对话后，记录会显示在这里。</span></div></div>
        </section>
        <footer class="main-foot"><span id="lastUpdated">尚未更新</span><span>最多保留 200 条记录</span></footer>
      </main>
    </section>
  </div>
  <dialog id="settingsDialog">
    <form id="settingsForm">
      <div class="dialog-head"><h2>界面设置</h2><button class="close" id="closeSettings" type="button" aria-label="关闭">×</button></div>
      <div class="settings">
        <div class="field"><label for="configTitle">页面标题</label><input id="configTitle" maxlength="40" required></div>
        <div class="field"><label for="refreshSeconds">自动刷新间隔</label><select id="refreshSeconds"><option value="1">1 秒</option><option value="2">2 秒</option><option value="3">3 秒</option><option value="5">5 秒</option><option value="10">10 秒</option></select></div>
        <div class="field"><label for="pageSize">最多显示</label><select id="pageSize"><option value="20">20 条</option><option value="50">50 条</option><option value="100">100 条</option><option value="200">200 条</option></select></div>
        <div class="checks">
          <label><input id="showCreatedAt" type="checkbox">显示设备生成时间</label>
          <label><input id="showSessionId" type="checkbox">显示完整会话编号</label>
          <label><input id="autoScroll" type="checkbox">有新消息时自动滚动到底部</label>
        </div>
        <div class="save-state" id="saveState" role="status"></div>
        <div class="dialog-actions"><button class="button" id="cancelSettings" type="button">取消</button><button class="button primary" type="submit">保存设置</button></div>
      </div>
    </form>
  </dialog>
  <script>
    const $ = id => document.getElementById(id);
    const elements = {
      title: $('pageTitle'), search: $('search'), device: $('device'), role: $('role'), session: $('session'),
      list: $('messageList'), empty: $('empty'), connection: $('connection'), summary: $('resultSummary'),
      messageCount: $('messageCount'), deviceCount: $('deviceCount'), updated: $('lastUpdated'), dialog: $('settingsDialog')
    };
    const defaults = {title: '陪伴对话记录', refresh_seconds: 2, page_size: 50, show_session_id: false, show_created_at: true, auto_scroll: true};
    let records = [], config = {...defaults}, pollTimer = null, renderedSignature = '';

    function formatTime(value, withDate = false) {
      const time = new Date(value);
      if (Number.isNaN(time.getTime())) return '时间未知';
      return new Intl.DateTimeFormat('zh-CN', withDate
        ? {year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false}
        : {hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false}).format(time);
    }

    function dateKey(value) {
      const time = new Date(value);
      return Number.isNaN(time.getTime()) ? '时间未知' : new Intl.DateTimeFormat('zh-CN', {year: 'numeric', month: 'long', day: 'numeric'}).format(time);
    }

    function replaceOptions(select, label, values) {
      const selected = select.value;
      select.replaceChildren(new Option(label, ''));
      for (const value of values.filter(Boolean).sort()) select.add(new Option(value, value));
      select.value = [...select.options].some(option => option.value === selected) ? selected : '';
    }

    function visibleRecords() {
      const keyword = elements.search.value.trim().toLocaleLowerCase('zh-CN');
      return records.filter(item =>
        (!elements.device.value || item.device_id === elements.device.value) &&
        (!elements.role.value || item.role === elements.role.value) &&
        (!elements.session.value || item.session_id === elements.session.value) &&
        (!keyword || item.text.toLocaleLowerCase('zh-CN').includes(keyword))
      ).slice(-config.page_size);
    }

    function render(force = false) {
      const shown = visibleRecords();
      const signature = JSON.stringify([shown.map(item => item.id), config, elements.device.value, elements.role.value, elements.session.value, elements.search.value]);
      if (!force && signature === renderedSignature) return;
      renderedSignature = signature;
      const fragment = document.createDocumentFragment();
      let currentDay = '';
      for (const item of shown) {
        const day = dateKey(item.received_at);
        if (day !== currentDay) {
          const divider = document.createElement('div'); divider.className = 'day'; divider.textContent = day; fragment.append(divider); currentDay = day;
        }
        const row = document.createElement('article'); row.className = `message ${item.role}`;
        const avatar = document.createElement('div'); avatar.className = 'avatar'; avatar.textContent = item.role === 'user' ? '用户' : '助手';
        const body = document.createElement('div'); body.className = 'message-body';
        const head = document.createElement('div'); head.className = 'message-head';
        const role = document.createElement('span'); role.textContent = item.role === 'user' ? '用户' : '语音助手';
        const device = document.createElement('span'); device.textContent = item.device_id || '未知设备';
        const time = document.createElement('time'); time.textContent = formatTime(config.show_created_at ? item.created_at : item.received_at);
        head.append(role, device, time);
        const bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.textContent = item.text;
        body.append(head, bubble);
        if (config.show_session_id) {
          const session = document.createElement('div'); session.className = 'session'; session.textContent = `会话 ${item.session_id || '未知'}`; body.append(session);
        }
        row.append(avatar, body); fragment.append(row);
      }
      elements.list.replaceChildren(fragment);
      elements.empty.hidden = shown.length > 0;
      if (!shown.length) elements.list.append(elements.empty);
      elements.summary.textContent = `筛选结果 ${shown.length} 条，共收到 ${records.length} 条`;
      elements.messageCount.textContent = records.length;
      elements.deviceCount.textContent = new Set(records.map(item => item.device_id).filter(Boolean)).size;
      if (config.auto_scroll && shown.length) elements.list.scrollTop = elements.list.scrollHeight;
    }

    function applyConfig(next) {
      config = {...defaults, ...next};
      document.title = config.title;
      elements.title.textContent = config.title;
      $('configTitle').value = config.title;
      $('refreshSeconds').value = String(config.refresh_seconds);
      $('pageSize').value = String(config.page_size);
      $('showSessionId').checked = config.show_session_id;
      $('showCreatedAt').checked = config.show_created_at;
      $('autoScroll').checked = config.auto_scroll;
      render(true);
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, {cache: 'no-store', signal: AbortSignal.timeout(5000), ...options});
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      return data;
    }

    async function loadConfig() {
      const data = await requestJson('/api/dialogue/config');
      applyConfig(data.config);
    }

    async function poll() {
      clearTimeout(pollTimer);
      try {
        const data = await requestJson('/api/dialogue/messages');
        records = Array.isArray(data.messages) ? data.messages : [];
        replaceOptions(elements.device, '全部设备', [...new Set(records.map(item => item.device_id))]);
        replaceOptions(elements.session, '全部会话', [...new Set(records.map(item => item.session_id))]);
        render();
        elements.connection.className = 'connection ok';
        elements.connection.lastElementChild.textContent = '服务已连接';
        elements.updated.textContent = `更新于 ${formatTime(new Date().toISOString())}`;
      } catch (_) {
        elements.connection.className = 'connection error';
        elements.connection.lastElementChild.textContent = '记录读取失败';
      } finally {
        pollTimer = setTimeout(poll, config.refresh_seconds * 1000);
      }
    }

    for (const element of [elements.search, elements.device, elements.role, elements.session]) element.addEventListener(element === elements.search ? 'input' : 'change', () => render(true));
    $('settingsButton').addEventListener('click', () => { $('saveState').textContent = ''; elements.dialog.showModal(); });
    for (const id of ['closeSettings', 'cancelSettings']) $(id).addEventListener('click', () => elements.dialog.close());
    $('settingsForm').addEventListener('submit', async event => {
      event.preventDefault();
      const next = {
        title: $('configTitle').value.trim(), refresh_seconds: Number($('refreshSeconds').value), page_size: Number($('pageSize').value),
        show_session_id: $('showSessionId').checked, show_created_at: $('showCreatedAt').checked, auto_scroll: $('autoScroll').checked
      };
      try {
        const data = await requestJson('/api/dialogue/config', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(next)});
        applyConfig(data.config); elements.dialog.close(); clearTimeout(pollTimer); poll();
      } catch (error) { $('saveState').textContent = `保存失败：${error.message}`; }
    });

    loadConfig().catch(() => applyConfig(defaults)).finally(poll);
  </script>
</body>
</html>
