<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>孩子的异常事件 · 童域智枢</title>
  <style>
    :root {
      --ink: #233b38; --muted: #687d77; --brand: #176b67; --brand-soft: #e4f2ef;
      --bad: #b3402f; --bad-soft: #fbeae6; --warn: #9a6a12; --warn-soft: #fbf1dd;
      --ok: #227a50; --ok-soft: #e7f4ec; --line: #dae4df;
    }
    [hidden] { display: none !important; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; background: #f2f6f5; color: var(--ink); font: 15px/1.7 "Segoe UI", "Microsoft YaHei", sans-serif; }
    .parent-main { max-width: 860px; margin: 0 auto; padding: clamp(20px, 5vw, 56px) 24px; }
    .parent-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
    .parent-head h1 { margin: 20px 0 8px; font-size: 30px; }
    .parent-head .refresh-time { color: var(--muted); font-size: 12px; }
    .child-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 22px; }
    .child-chip { padding: 4px 12px; background: var(--brand-soft); border: 1px solid #bfe0da; color: var(--brand); border-radius: 999px; font-size: 13px; }
    .parent-note { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
    .event-card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin: 0 0 14px; }
    .event-card-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
    .event-card-head h2 { margin: 0; font-size: 17px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { padding: 2px 10px; border-radius: 999px; font-size: 11px; line-height: 1.8; border: 1px solid var(--line); }
    .chip[data-tone="bad"] { color: var(--bad); background: var(--bad-soft); border-color: #f0cbc2; }
    .chip[data-tone="warn"] { color: var(--warn); background: var(--warn-soft); border-color: #f0ddb8; }
    .chip[data-tone="ok"] { color: var(--ok); background: var(--ok-soft); border-color: #c8e6d4; }
    .chip[data-tone="idle"] { color: var(--muted); background: #f2f5f4; }
    .event-meta { color: var(--muted); font-size: 12px; margin: 8px 0 4px; }
    .event-detail { font-size: 13px; margin: 6px 0 0; overflow-wrap: anywhere; }
    .event-students { margin-top: 8px; color: var(--brand); font-size: 12px; }
    .evidence-frame { margin-top: 12px; }
    .evidence-frame img { display: block; max-width: 100%; max-height: 420px; border-radius: 10px; border: 1px solid var(--line); }
    .evidence-frame p { color: var(--muted); font-size: 11px; margin: 5px 0 0; }
    .event-status-note { margin-top: 8px; padding: 8px 10px; background: var(--brand-soft); border-radius: 8px; color: var(--brand); font-size: 12px; }
    .empty-box { padding: 30px 18px; text-align: center; color: var(--muted); background: #fff; border: 1px dashed var(--line); border-radius: 14px; }
    .parent-foot { margin-top: 26px; color: var(--muted); font-size: 12px; }
    @media (max-width: 700px) { .parent-main { padding: 24px 16px; } .parent-head h1 { font-size: 25px; } }
  </style>
</head>
<body data-access-page="parent">
<main class="parent-main">
  <div class="parent-head">
    <h1>孩子的异常事件</h1>
    <span class="refresh-time" id="refreshTime">正在读取…</span>
  </div>
  <div class="child-chips" id="childChips"></div>
  <p class="parent-note">这里显示老师已关联到您孩子的事件；请以班级老师的通知和现场确认为准。</p>
  <div id="parentEventList"></div>
  <p class="empty-box" id="parentEmpty" hidden>暂无与孩子相关的异常事件。</p>
  <footer class="parent-foot">仅展示与您账号绑定孩子相关的事件及证据画面；如有疑问请联系班级老师。</footer>
</main>
<script>
  (() => {
    "use strict";
    const TYPE_LABELS = {
      fall: "摔倒",
      fight: "斗殴",
      device_offline: "设备离线",
      sensor_expired: "数据过期",
      environment: "环境异常",
      dialogue_attention: "对话关注",
      sensor_recovered: "数据恢复"
    };
    const STATUS_LABELS = {
      pending: ["待处理", "warn"],
      resolved: ["已处理", "ok"],
      false_alarm: ["误报", "idle"]
    };
    const LEVEL_LABELS = { urgent: ["紧急", "bad"], watch: ["关注", "warn"], info: ["提示", "idle"] };
    const list = document.getElementById("parentEventList");
    const empty = document.getElementById("parentEmpty");
    const chips = document.getElementById("childChips");
    const refreshTime = document.getElementById("refreshTime");
    const formatter = new Intl.DateTimeFormat("zh-CN", {
      timeZone: "Asia/Shanghai",
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hourCycle: "h23"
    });
    const setText = (node, value) => { const next = String(value ?? ""); if (node.textContent !== next) node.textContent = next; };
    const make = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    };
    function renderChildren(children) {
      chips.replaceChildren();
      for (const child of children || []) {
        chips.append(make("span", "child-chip", child.name || child.id));
      }
      if (!children || children.length === 0) {
        chips.append(make("span", "child-chip", "尚未绑定学生"));
      }
    }
    function renderEvents(events) {
      list.replaceChildren();
      if (!events || events.length === 0) {
        empty.hidden = false;
        return;
      }
      empty.hidden = true;
      for (const event of events) {
        const card = make("article", "event-card");
        const head = make("div", "event-card-head");
        head.append(make("h2", null, event.summary || TYPE_LABELS[event.event_type] || "异常事件"));
        const metaChips = make("div", "chips");
        const typeChip = make("span", "chip", TYPE_LABELS[event.event_type] || event.event_type || "异常事件");
        typeChip.dataset.tone = event.event_type === "fall" || event.event_type === "fight" ? "bad" : "idle";
        const [levelLabel, levelTone] = LEVEL_LABELS[event.level] || ["关注", "warn"];
        const levelChip = make("span", "chip", levelLabel);
        levelChip.dataset.tone = levelTone;
        const [statusLabel, statusTone] = STATUS_LABELS[event.status] || ["待处理", "warn"];
        const statusChip = make("span", "chip", statusLabel);
        statusChip.dataset.tone = statusTone;
        metaChips.append(typeChip, levelChip, statusChip);
        head.append(metaChips);
        card.append(head);
        card.append(make("p", "event-meta", `${formatter.format(new Date(event.occurred_at))} · ${event.location || "未记录"} · ${event.class_name || "未分班"}`));
        if (event.detail) card.append(make("p", "event-detail", event.detail));
        const students = (event.students || []).filter((item) => item && item.id);
        if (students.length) {
          card.append(make("p", "event-students", `涉及孩子：${students.map((item) => item.name || item.id).join("、")}`));
        }
        if (event.evidence_url) {
          const frame = make("div", "evidence-frame");
          const image = document.createElement("img");
          image.alt = `${event.summary || "事件"}的证据画面`;
          image.loading = "lazy";
          image.onerror = () => frame.remove();
          image.src = event.evidence_url;
          frame.append(image);
          if (event.evidence_captured_at) {
            frame.append(make("p", null, `证据时间：${formatter.format(new Date(event.evidence_captured_at))}`));
          }
          card.append(frame);
        }
        if (event.status !== "pending" || event.note) {
          const note = make("p", "event-status-note");
          setText(note, event.status !== "pending"
            ? `${statusLabel} · 处理人：${event.handled_by || "值班老师"}${event.note ? "；备注：" + event.note : ""}`
            : `老师备注：${event.note}`);
          card.append(note);
        }
        list.append(card);
      }
    }
    async function loadEvents() {
      try {
        const response = await fetch("/api/parent/events", { cache: "no-store", headers: { Accept: "application/json" } });
        if (response.status === 401 || response.status === 403) { location.reload(); return; }
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        renderChildren(data.children);
        renderEvents(data.events);
        setText(refreshTime, `更新于 ${new Intl.DateTimeFormat("zh-CN", { timeZone: "Asia/Shanghai", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" }).format(new Date())} · 每 15 秒自动刷新`);
      } catch (error) {
        setText(refreshTime, "读取失败，将自动重试");
      }
    }
    loadEvents();
    setInterval(() => {
      if (!document.hidden) loadEvents();
    }, 15000);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) loadEvents();
    });
  })();
</script>
</body>
</html>
