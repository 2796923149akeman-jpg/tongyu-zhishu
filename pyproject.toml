[tool.ruff]
# 与运行环境保持一致：课程环境使用 Python 3.10。
target-version = "py310"
line-length = 120
extend-exclude = ["xiaozhi-server", "docs", ".venv", "venv", "dashboard/evidence", "dashboard/event_snapshots"]

[tool.ruff.lint]
# 只启用高价值、低争议的规则：语法/未定义名/未使用导入/导入顺序。
select = ["E4", "E7", "E9", "F", "W", "I"]
ignore = [
    "E501",  # 长行由格式化工具和人工评审处理，避免与 HTML/长字符串冲突
]

[tool.ruff.lint.per-file-ignores]
# 测试脚本会先调整 sys.path 再导入，且部分断言使用紧凑写法，允许该模式。
"tests/*" = ["E402", "E701", "E702"]
# server.py 先插入项目路径再导入本地模块，属于刻意的导入顺序。
"dashboard/server.py" = ["E402"]
